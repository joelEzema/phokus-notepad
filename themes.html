<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Phokus | Appearance</title>
</head>
<body>
    <main class="themes-page">
      <header class="themes-header">
        <a class="themes-brand" href="index.html"><span>Phokus</span><span class="themes-brand-divider">/</span><span class="themes-brand-section">Appearance</span></a>
        <a class="themes-back-link" href="index.html"><span aria-hidden="true">&larr;</span> Notepad</a>
      </header>

      <section class="themes-content" aria-labelledby="themes-title">
        <p class="themes-eyebrow">PREFERENCES</p>
        <h1 id="themes-title">Appearance</h1>
        <p class="themes-intro">Choose a tone for your writing space.</p>

        <fieldset class="theme-selector">
          <legend>Color theme</legend>
          <div class="theme-options">
            <label class="theme-option">
              <input type="radio" name="theme-choice" value="default">
              <span class="theme-option-body">
                <span class="theme-preview theme-preview--default" aria-hidden="true"><span class="theme-preview-letter">Aa</span><span class="theme-preview-lines"></span></span>
                <span class="theme-option-copy"><span class="theme-option-name">Default</span><span class="theme-option-description">Warm, softened ivory</span></span>
                <span class="theme-option-indicator" aria-hidden="true"></span>
              </span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme-choice" value="dark">
              <span class="theme-option-body">
                <span class="theme-preview theme-preview--dark" aria-hidden="true"><span class="theme-preview-letter">Aa</span><span class="theme-preview-lines"></span></span>
                <span class="theme-option-copy"><span class="theme-option-name">Dark</span><span class="theme-option-description">Quiet charcoal</span></span>
                <span class="theme-option-indicator" aria-hidden="true"></span>
              </span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme-choice" value="light">
              <span class="theme-option-body">
                <span class="theme-preview theme-preview--light" aria-hidden="true"><span class="theme-preview-letter">Aa</span><span class="theme-preview-lines"></span></span>
                <span class="theme-option-copy"><span class="theme-option-name">Light</span><span class="theme-option-description">Crisp, clean white</span></span>
                <span class="theme-option-indicator" aria-hidden="true"></span>
              </span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme-choice" value="moss">
              <span class="theme-option-body">
                <span class="theme-preview theme-preview--moss" aria-hidden="true"><span class="theme-preview-letter">Aa</span><span class="theme-preview-lines"></span></span>
                <span class="theme-option-copy"><span class="theme-option-name">Moss</span><span class="theme-option-description">Muted green-gray</span></span>
                <span class="theme-option-indicator" aria-hidden="true"></span>
              </span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme-choice" value="frost">
              <span class="theme-option-body">
                <span class="theme-preview theme-preview--frost" aria-hidden="true"><span class="theme-preview-letter">Aa</span><span class="theme-preview-lines"></span></span>
                <span class="theme-option-copy"><span class="theme-option-name">Frost</span><span class="theme-option-description">Cool, pale blue-gray</span></span>
                <span class="theme-option-indicator" aria-hidden="true"></span>
              </span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme-choice" value="rosewater">
              <span class="theme-option-body">
                <span class="theme-preview theme-preview--rosewater" aria-hidden="true"><span class="theme-preview-letter">Aa</span><span class="theme-preview-lines"></span></span>
                <span class="theme-option-copy"><span class="theme-option-name">Rosewater</span><span class="theme-option-description">Dusty rose</span></span>
                <span class="theme-option-indicator" aria-hidden="true"></span>
              </span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme-choice" value="midnight-pine">
              <span class="theme-option-body">
                <span class="theme-preview theme-preview--midnight-pine" aria-hidden="true"><span class="theme-preview-letter">Aa</span><span class="theme-preview-lines"></span></span>
                <span class="theme-option-copy"><span class="theme-option-name">Midnight Pine</span><span class="theme-option-description">Deep evergreen</span></span>
                <span class="theme-option-indicator" aria-hidden="true"></span>
              </span>
            </label>
            <label class="theme-option">
              <input type="radio" name="theme-choice" value="blue-hour">
              <span class="theme-option-body">
                <span class="theme-preview theme-preview--blue-hour" aria-hidden="true"><span class="theme-preview-letter">Aa</span><span class="theme-preview-lines"></span></span>
                <span class="theme-option-copy"><span class="theme-option-name">Blue Hour</span><span class="theme-option-description">Deep blue-gray</span></span>
                <span class="theme-option-indicator" aria-hidden="true"></span>
              </span>
            </label>
          </div>
        </fieldset>
      </section>
    </main>
    <script src="theme-switch.js"></script>
</body>
</html>
